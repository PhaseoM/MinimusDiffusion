defaults:
  - diffusion: default
  - autoencoder: default
  - data: default
  - optim: adamw
  - hydra: default
  - _self_

exp_name: "exp001"
seed: 1105
seed_everything: True
save_freq: 5
timestamp: ${now:%Y-%m-%d_%H-%M-%S}
auto_resume: False
resume_path: ${.ckpts_dir}/ckpt_epoch_0005.pth

amp:
  enabled: True
  autocast_dtype: float16
distributed:
  main_rank: 0
result:
  results_dir: ./results
  output_dir: ${.results_dir}/${exp_name}
  ckpts_dir: ${.output_dir}/ckpts
  logs_dir: ${.output_dir}/logs
