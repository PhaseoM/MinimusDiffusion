defaults:
  - dataset: mm_celeba_hq
  - _self_

batch_size: 16
seed: ${seed}
use_cache: False
train:
  shuffle: True
  num_workers: 4
  pin_memory: True
val:
  dataset_ratio: 0.1
  val_epoch_freq: 1
  shuffle: False
  num_workers: 4
  pin_memory: True
  training: False
test:
  dataset_ratio: 0.1
  shuffle: False
  num_workers: 4
  pin_memory: True
  num_samples: 3000
  num_timesteps: 100
  guidance_scales: [1.0, 1.5, 2.0, 3.0, 5.0]
  