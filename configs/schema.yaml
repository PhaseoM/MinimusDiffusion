MODEL:
  NAME: "unet"
  RESUME: ""
  NUM_LAYERS: 4
  NUM_CLASSES: 2
  BASE_CHANNELS: 64
  SKIP_PROCESS: "NULL" # NULL, ONE_RES, DUAL_RES
  INCLUDE_BG: false
  DROP_RATE: 0.0
  DROP_PATH_RATE: 0.1
  LABEL_SMOOTHING: 0.1
PATH:
  ROOT: "."
  PARENT: ".."
  CONFIGS: "${.ROOT}/configs"
  CURRENT_CONFIG: "${.CONFIGS}/default.yaml"
  DATABASE: "${.PARENT}/datasets"
  DATASET: "${.DATABASE}/ISIC2016"
  TRAIN_DATA: "${.DATASET}/ISBI2016_ISIC_Part1_Training_Data"
  TRAIN_GT: "${.DATASET}/ISBI2016_ISIC_Part1_Training_GroundTruth"
  TEST_DATA: "${.DATASET}/ISBI2016_ISIC_Part1_Test_Data"
  TEST_GT: "${.DATASET}/ISBI2016_ISIC_Part1_Test_GroundTruth"
  DATA: "${.ROOT}/data"
  DATA_DUMP: "${.DATA}/data_dump"
  DATA_EVAL: "${.DATA}/data_eval"
  LOG_INFO: "${.DATA}/log_info"
  CHECKPOINTS: "${.DATA}/checkpoints"
DATA:
  NAME: "ISIC2016"
  BATCH_SIZE: 16
  IMAGE_SIZE: [256, 256]
  IMAGE_CHANNELS: 3
  MAIN_RANK: 0
  AMP: true
  WORLD_SIZE: 4
  NUM_WORKERS: 4
  AUG:
    AUTO_AUGMENT: false
OPTIM:
  NAME: "sgd"
  BASE_LR: 8e-2
  WARMUP_LR: 8e-4
  WARMUP_STEP: 100
  MOMENTUM: 0.9
  BETAS: [0.9, 0.999]
  WEIGHT_DECAY: 1e-4
  DROPOUT: 0.1
  EPS: 1e-8
  SCHEDULER:
    NAME: "multistep"
TRAIN:
  START_EPOCH: 0
  EPOCHS: 100
  SAVE_FREQ: 5
TEST:
  PARALLEL: false
SEED: 42
TRAIN_MODE: true
EVAL_MODE: false
PROCESS_MODE: false