seed: 42
seed_everything: true
auto_resume: false
batch_size: 96
save_freq: 5

model:
  name: "vae"
  init_channels: 8
  z_channels: 4
  x_channels: 1
  ch_mult: [1, 2, 4, 4]
path:
  config_dir: ./configs
  config_path: ${.config_dir}/autoencoders/vae_default.yaml
  dataset_dir: ./datasets
  dataset_path: ${.dataset_dir}/mnist
data:
  dataset_name: "Mnist"
  val_ratio: 0.1
  img_size: [32, 32]
  img_channels: 1
augs:
  auto_augment: false
optim:
  name: "adam"
  base_lr: 3e-4
  warmup_lr: 5e-5
  warmup_step: 100
  momentum: 0.9
  betas: [0.9, 0.999]
  weight_decay: 1e-4
  drop_out: 0.1
  eps: 1e-8
  scheduler:
    name: "multistep"
dist:
  amp: true
  main_rank: 0
  world_size: 1
  num_workers: 0
train:
  batch_size: ${batch_size}
  start_epoch: 0
  epochs: 50
val:
  batch_size: ${batch_size}
test:
  batch_size: ${batch_size}
mode:
  train: true
  eval: false
  process: false
