config_name: "diffusionmodels/dit_tiny4"
seed: 42
seed_everything: true
auto_resume: false
batch_size: 48
save_freq: 150
timestamp: ${now:%Y-%m-%d_%H-%M-%S}
eps: 0.001

model:
  name: "DiT"
  text_encoder_name: "clip-vit-large-patch14"
  fullname: ${.name}_${timestamp}
  num_layers: 3
  d_model: 128
  num_heads: 4
  mlp_hiddens: 512
  patch_size: 4
  final_dim: 16
  z_img_size: 32
  guidance_scale: 2

  beta: 0.1
  init_channels: 64
  z_channels: 8
  x_channels: 3
  ch_mult: [1, 2, 4, 4]
  shift_factor: 0
  scale_factor: 1
  num_groups: 1
path:
  resume_path: ${.ckpts_dir}/ckpt_epoch_0005.pth
  eval_load_path: ${.ckpts_dir}/best_ckpt.pth
  vae_ckpt_path: "./results/VAE_mmchq_f8c8_betae-1/ckpts/ckpt_epoch_0100.pth"
data:
  dataset_name: "mm-celeba-hq"
  prompt_drop_rate: 0.1
  val_ratio: 0.1
  img_size: [256, 256]
  img_channels: 3
augs:
  auto_augment: false
optim:
  name: "adam"
  base_lr: 1e-3
  warmup_lr: 8e-4
  warmup_step: 300
  momentum: 0.9
  betas: [0.9, 0.999]
  weight_decay: 1e-4
  drop_out: 0.1
  eps: 1e-8
  scheduler:
    name: "multistep"
dist:
  amp: true
  main_rank: 0
  world_size: 3
  num_workers: 4
train:
  batch_size: ${batch_size}
  start_epoch: 0
  epochs: 300
val:
  batch_size: ${batch_size}
test:
  batch_size: ${batch_size}
  num_timesteps: 100
  num_samples: 1000
cache:
  use_latent_features: true
  use_text_featrues: true
mode:
  train: true
  val: false
  test: false