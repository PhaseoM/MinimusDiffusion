config_name: "diffusionmodels/schema"
seed: 42
seed_everything: true
auto_resume: false
batch_size: 16
save_freq: 5
timestamp: ${now:%Y-%m-%d_%H-%M-%S}
eps: 0.001

model:
  name: "DiT"
  text_encoder_name: "clip-vit-large-patch14"
  fullname: ${.name}_${timestamp}
  num_layers: 4
  d_model: 512
  num_heads: 1
  mlp_hiddens: 2048
  patch_size: 4
  final_dim: 16
  z_img_size: 32
  guidance_scale: 2
  
  beta: 0.01
  init_channels: 64
  z_channels: 8
  x_channels: 3
  ch_mult: [1, 2, 4, 4]
  shift_factor: 0
  scale_factor: 1
  num_groups: 1
path:
  config_dir: ./configs
  config_path: ${.config_dir}/${config_name}.yaml
  # dataset_paths
  dataset_dir: ./datasets
  dataset_path: ${.dataset_dir}/${data.dataset_name}
  cache_path: ${.dataset_path}/caches
  # results_paths
  results_dir: ./results
  output_dir: ${.results_dir}/${model.fullname}
  ckpts_dir: ${.output_dir}/ckpts
  data_dump_dir: ${.output_dir}/data_dump
  logs_dir: ${.output_dir}/logs
  # preload_paths
  text_encoder_path: ./pretrained/${model.text_encoder_name}
  # custom_paths
  resume_path: ${.ckpts_dir}/ckpt_epoch_0005.pth
  eval_load_path: ${.ckpts_dir}/best_ckpt.pth
  vae_ckpt_path: ./results/VAE_mmchq_f8c8_betae-1/ckpts/ckpt_epoch_0100.pth
data:
  dataset_name: "mm-celeba-hq"
  use_cache: false
  prompt_drop_rate: 0.1
  img_size: [256, 256]
  img_channels: 3
augs:
  auto_augment: false
optim:
  name: "adamw"
  base_lr: 1e-4
  warmup_lr: 8e-4
  warmup_step: 300
  momentum: 0.9
  betas: [0.9, 0.999]
  weight_decay: 0.0
  eps: 1e-8
  scheduler:
    name: "multistep"
dist:
  amp: true
  main_rank: 0
  world_size: 4
  num_workers: 4
train:
  batch_size: ${batch_size}
  start_epoch: 0
  epochs: 100
val:
  batch_size: ${batch_size}
  dataset_ratio: 0.1
  val_epoch_freq: 1
test:
  batch_size: ${batch_size}
  dataset_ratio: 0.1
  guidance_scales: [1.0, 1.5, 2.0, 3.0, 5.0]
  num_timesteps: 100
  num_samples: 3000
mode:
  train: true
  val: false
  test: false
